<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if page.title %}{{ page.title }} · GX{% else %}GX 的博客{% endif %}</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f5f5f7; --text: #1d1d1f;
    --muted: #86868b; --accent: #0071e3; --border: #d2d2d7; --card: #fbfbfd;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 52px;
    background: rgba(255,255,255,0.82);
    backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 0.5px solid rgba(0,0,0,0.1);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 max(24px, calc(50% - 560px));
  }
  .nav-logo { font-size: 1.05rem; font-weight: 600; letter-spacing: -0.02em; color: var(--text); text-decoration: none; }
  .nav-links { display: flex; gap: 2.2rem; }
  .nav-links a { font-size: 0.82rem; color: var(--muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover { color: var(--text); }
  .nav-links a.active { color: var(--text); }
  main { padding-top: 52px; }
  footer {
    border-top: 0.5px solid var(--border);
    padding: 2.5rem 24px; text-align: center;
    font-size: 0.75rem; color: var(--muted);
  }
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/">GX</a>
  <div class="nav-links">
    <a href="/" {% if page.url == '/' %}class="active"{% endif %}>首页</a>
    <a href="/blog" {% if page.url contains '/blog' %}class="active"{% endif %}>博客</a>
    <a href="/contact" {% if page.url == '/contact/' %}class="active"{% endif %}>联系</a>
  </div>
</nav>
<main>
  {{ content }}
</main>
<footer>Copyright © 2026 GX · 托管于 GitHub Pages</footer>
</body>
</html>
