---
layout: default
---
<style>
  .post-wrap { max-width: 680px; margin: 0 auto; padding: 64px 24px 96px; }
  .post-back { display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.82rem; color: var(--accent); text-decoration: none; margin-bottom: 2.5rem; }
  .post-back:hover { opacity: 0.7; }
  .post-category { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 0.8rem; }
  .post-title { font-size: clamp(1.8rem, 4vw, 2.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.2; margin-bottom: 1rem; }
  .post-meta { font-size: 0.8rem; color: var(--muted); margin-bottom: 3rem; padding-bottom: 2rem; border-bottom: 0.5px solid var(--border); }
  .post-content { font-size: 1rem; line-height: 1.85; color: #1d1d1f; }
  .post-content h2 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.02em; margin: 2.5rem 0 0.8rem; }
  .post-content h3 { font-size: 1.1rem; font-weight: 600; margin: 2rem 0 0.6rem; }
  .post-content p { margin-bottom: 1.4rem; }
  .post-content ul, .post-content ol { padding-left: 1.5rem; margin-bottom: 1.4rem; }
  .post-content li { margin-bottom: 0.4rem; }
  .post-content code { background: var(--bg2); padding: 0.15rem 0.45rem; border-radius: 5px; font-size: 0.88em; font-family: "SF Mono", Menlo, monospace; }
  .post-content pre { background: var(--bg2); padding: 1.2rem 1.4rem; border-radius: 12px; overflow-x: auto; margin-bottom: 1.4rem; }
  .post-content pre code { background: none; padding: 0; }
  .post-content blockquote { border-left: 3px solid var(--accent); padding-left: 1.2rem; color: var(--muted); margin-bottom: 1.4rem; }
  .post-content a { color: var(--accent); text-decoration: none; }
  .post-content a:hover { text-decoration: underline; }
</style>

<div class="post-wrap">
  <a class="post-back" href="/blog">← 所有文章</a>
  <div class="post-category">{{ page.categories | first }}</div>
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-meta">
    {{ page.date | date: "%Y年%-m月%-d日" }} · {{ content | number_of_words | divided_by: 200 | plus: 1 }} 分钟阅读
  </div>
  <div class="post-content">
    {{ content }}
  </div>
</div>
