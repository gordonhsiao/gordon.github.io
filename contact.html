<style>
  .contact-hero { max-width: 640px; margin: 0 auto; padding: 80px 24px 48px; }
  .contact-hero h1 { font-size: clamp(1.8rem, 4vw, 2.8rem); font-weight: 700; letter-spacing: -0.03em; margin-bottom: 0.5rem; }
  .contact-hero p { color: #86868b; font-size: 1rem; max-width: 400px; line-height: 1.7; }
  .contact-list { max-width: 640px; margin: 0 auto; padding: 0 24px 96px; display: flex; flex-direction: column; gap: 0.5px; background: #d2d2d7; border-radius: 18px; overflow: hidden; }
  .contact-item { display: flex; align-items: center; gap: 1.2rem; padding: 1.4rem 1.6rem; background: #fbfbfd; text-decoration: none; color: inherit; transition: background 0.2s; }
  .contact-item:hover { background: #f5f5f7; }
  .c-icon { width: 40px; height: 40px; border-radius: 10px; background: #f5f5f7; display: flex; align-items: center; justify-content: center; font-size: 1.1rem; flex-shrink: 0; }
  .c-label { font-size: 0.75rem; color: #86868b; margin-bottom: 0.1rem; }
  .c-value { font-size: 0.92rem; font-weight: 500; }
  .c-arrow { margin-left: auto; color: #86868b; }
</style>
